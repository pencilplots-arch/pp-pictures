# Temporary PUBLIC picture machine (user 20:05-20:07 created it for this; contents deleted after). Free picture machine (user, 22 Nov 2026 19:01: "Use whatever else you can instead of kaggle. Remember I am not monetised yet").
# FLUX.2 klein 4B (GGUF) through stable-diffusion.cpp on GitHub's CPU runners. The job list (jobs.json from
# tools/sdcpp_prompts.py, plus c_extra.png and any refs) sits on a private bundle branch; pictures come back as 1-day artifacts.
name: sdimg
run-name: sdimg ${{ inputs.bundle }} ${{ inputs.stage }} x${{ inputs.n }}
on:
  workflow_dispatch:
    inputs:
      bundle: {description: 'branch with jobs.json', required: false, default: 'main'}
      stage:  {description: 'refs, free, named or shots', required: true}
      n:      {description: 'number of parallel machines', required: true}
      quant:  {description: 'diffusion gguf quant', required: false, default: 'Q8_0'}
      scale:  {description: 'draw size factor (then upscaled)', required: false, default: '1'}
permissions:
  contents: read
env:
  SDCPP: 0d71f963af9c94941f4a67e8ea145935651dd756
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/cache@v4
        id: c
        with: {path: sd-cli, key: 'sdcli-${{ env.SDCPP }}'}
      - if: steps.c.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/leejet/stable-diffusion.cpp s && cd s && git checkout -q $SDCPP && git submodule update -q --init --recursive
          cmake -S . -B b -DCMAKE_BUILD_TYPE=Release -DSD_WEBM=OFF > /dev/null && (cmake --build b -j4 --target sd-cli || cmake --build b -j1 --target sd-cli) 2>&1 | tail -3
          cp b/bin/sd-cli ../sd-cli
      - uses: actions/upload-artifact@v4
        with: {name: sd-cli, path: sd-cli, retention-days: 1}
  matrix:
    runs-on: ubuntu-latest
    outputs: {idx: '${{ steps.m.outputs.idx }}'}
    steps:
      - id: m
        run: python3 -c "import json;print('idx='+json.dumps(list(range(${{ inputs.n }}))))" >> $GITHUB_OUTPUT
  gen:
    needs: [build, matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: {i: '${{ fromJson(needs.matrix.outputs.idx) }}'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.bundle }}', path: b}
      - uses: actions/download-artifact@v4
        with: {name: sd-cli, path: bin}
      - uses: actions/cache@v4
        with: {path: models, key: 'klein4b-${{ inputs.quant }}-v1'}
      - name: models
        run: |
          mkdir -p models && cd models
          get() { [ -s "$2" ] || curl -sSL --retry 4 -o "$2" "https://huggingface.co/$1/resolve/main/$2?download=true"; }
          get leejet/FLUX.2-klein-4B-GGUF flux-2-klein-4b-${{ inputs.quant }}.gguf
          get unsloth/Qwen3-4B-GGUF Qwen3-4B-Q4_K_M.gguf
          [ -s flux2-vae.safetensors ] || curl -sSL --retry 4 -o flux2-vae.safetensors "https://huggingface.co/Comfy-Org/flux2-klein-4B/resolve/main/split_files/vae/flux2-vae.safetensors?download=true"
          ls -la
      - name: generate
        run: |
          pip install -q pillow; chmod +x bin/sd-cli; mkdir -p out
          PP_SCALE=${{ inputs.scale }} python3 b/run_sd.py b/jobs.json ${{ inputs.stage }} ${{ matrix.i }} ${{ inputs.n }} models ${{ inputs.quant }} out
          ls out | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'out-${{ matrix.i }}', path: out, retention-days: 1}
